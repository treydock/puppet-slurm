name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:


jobs:
  unit:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.allow_failure }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: 3.2
            openvox: 8
            fixtures: .fixtures.yml
            allow_failure: false
          - ruby: 4.0
            openvox: 9
            fixtures: .fixtures.yml
            allow_failure: false
    env:
      BUNDLE_WITHOUT: system_tests:release
      OPENVOX_GEM_VERSION: "~> ${{ matrix.openvox }}.0"
      FIXTURES_YML: ${{ matrix.fixtures }}
    name: OpenVox ${{ matrix.openvox }} (Ruby ${{ matrix.ruby }})
    steps:
      - uses: actions/checkout@v3
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          cache-version: 3
      - name: Validate
        run: bundle exec rake check:git_ignore check:dot_underscore check:test_file rubocop syntax lint metadata_lint
      - name: Run tests
        run: bundle exec rake parallel_spec
  acceptance:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        set:
          - "el8"
          - "el9"
          - "debian-12"
          - "ubuntu-2204"
          - "ubuntu-2404"
        openvox:
          - "openvox8"
          - "openvox9"
        slurm_version:
          - "25.05.6"
          - "25.11.2"
          - "26.05.5"
    env:
      BUNDLE_WITHOUT: release
      BEAKER_debug: true
    name: ${{ matrix.openvox }} ${{ matrix.set }} (slurm=${{ matrix.slurm_version }})
    steps:
      - uses: actions/checkout@v3
      - name: Setup ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          cache-version: 3
      - name: Run tests
        run: bundle exec rake beaker
        env:
          BEAKER_PUPPET_COLLECTION: ${{ matrix.openvox }}
          BEAKER_set: ${{ matrix.set }}
          BEAKER_slurm_version: ${{ matrix.slurm_version }}
